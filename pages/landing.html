<style>
        body {
            background-color: #0a0a0a;
            color: #e5e2e1;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Hand drawn borders */
        .drawn-border {
            border: 2px solid #0A0A0A;
            border-radius: 4px 12px 6px 8px;
        }

        /* Hover Transitions */
        .panel {
            transition: transform 0.5s ease-in-out;
            position: relative;
        }
        .panel:not(.hero-panel):hover {
            transform: scale(1.02);
            z-index: 10;
        }
        .hero-panel:hover {
            z-index: 10;
        }

        /* Hero Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .panel:hover .hero-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Spider Animation */
        .spider-anim {
            animation-play-state: paused;
        }
        .panel:hover .spider-anim {
            animation-play-state: running;
        }

        /* Web Path Animation */
        .path-crawler {
            offset-path: path('M 50 150 C 150 150, 150 50, 250 50');
            offset-distance: 0%;
            transition: offset-distance 2s ease-in-out;
            opacity: 0;
        }
        .panel:hover .path-crawler {
            offset-distance: 100%;
            opacity: 1;
        }

        /* Data Packs */
        @keyframes travelPacket {
            0% { offset-distance: 0%; opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }
        .packet {
            offset-path: path('M 50 150 C 150 150, 150 50, 250 50');
            opacity: 0;
            position: absolute;
        }
        .panel:hover .packet-1 { animation: travelPacket 1.5s linear infinite; }
        .panel:hover .packet-2 { animation: travelPacket 1.5s linear infinite 0.5s; }
        .panel:hover .packet-3 { animation: travelPacket 1.5s linear infinite 1s; }
        
        .success-check {
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }
        .panel:hover .success-check {
            opacity: 1;
            transform: scale(1);
            transition-delay: 1.5s;
        }

        /* Shader Pulse */
        .shader-overlay {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .panel:hover .shader-overlay {
            opacity: 1;
        }
        
        .bento-pulse {
            transition: transform 0.3s ease;
        }
        .panel:hover .bento-pulse {
            transform: scale(1.05);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(42, 157, 143, 0.5)); }
            50% { filter: drop-shadow(0 0 15px rgba(42, 157, 143, 0.8)); }
        }

        /* Data Particles & People Movement */
        .people-move {
            transition: transform 0.5s ease;
        }
        .panel:hover .people-move {
            transform: translateY(-5px) rotate(1deg);
        }
        .particle {
            opacity: 0;
            transition: opacity 0.5s ease, transform 1s ease;
        }
        .panel:hover .particle-1 { opacity: 1; transform: translate(20px, -20px); }
        .panel:hover .particle-2 { opacity: 1; transform: translate(-15px, -30px); }
        .panel:hover .particle-3 { opacity: 1; transform: translate(30px, 10px); }
        
        .cursor-anim {
            opacity: 0;
            transform: translate(0,0);
            transition: all 1s ease;
        }
        .panel:hover .cursor-anim {
            opacity: 1;
            transform: translate(50px, 30px);
        }
        
        @keyframes floatCard {
            0% { transform: translateY(0) rotate(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-50px) rotate(10deg); opacity: 0; }
        }
        .floating-card {
            opacity: 0;
            position: absolute;
        }
        .panel:hover .floating-card-1 { animation: floatCard 3s ease-in-out infinite; }
        .panel:hover .floating-card-2 { animation: floatCard 3s ease-in-out infinite 1.5s; }

        /* Chat Animation */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .panel:hover .chat-bubble {
            animation: bounce 1s ease infinite;
        }
        .typing-indicator {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .panel:hover .typing-indicator {
            opacity: 1;
        }
        
        @keyframes appearSequence {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-element {
            opacity: 0;
        }
        .panel:hover .chat-element-1 { animation: appearSequence 0.5s forwards 0.2s; }
        .panel:hover .chat-element-2 { animation: appearSequence 0.5s forwards 0.7s; }
        .panel:hover .chat-element-3 { animation: appearSequence 0.5s forwards 1.2s; }
        
        .extract-icon {
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
        }
        .panel:hover .extract-icon {
            opacity: 1;
            transform: translateX(20px);
            transition-delay: 1.5s;
        }

        /* Extraction Animation */
        .highlight-box {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .panel:hover .highlight-box {
            opacity: 0.3;
        }
        .data-row {
            transform: translateX(-20px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .panel:hover .data-row:nth-child(1) { transform: translateX(0); opacity: 1; transition-delay: 0.1s; }
        .panel:hover .data-row:nth-child(2) { transform: translateX(0); opacity: 1; transition-delay: 0.2s; }
        .panel:hover .data-row:nth-child(3) { transform: translateX(0); opacity: 1; transition-delay: 0.3s; }
        
        .robotic-arm {
            transition: transform 0.5s ease;
            transform-origin: bottom center;
        }
        .panel:hover .robotic-arm {
            transform: rotate(5deg) scale(1.02);
        }
        
        @keyframes flyToTable {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(150px, -50px) scale(0.5); opacity: 0; }
        }
        .flying-card {
            opacity: 0;
            position: absolute;
        }
        .panel:hover .flying-card-1 { animation: flyToTable 1.5s ease-in forwards 0.5s; }
        .panel:hover .flying-card-2 { animation: flyToTable 1.5s ease-in forwards 1.0s; }

    </style>
</head>

<script>
    (function() {
        const panel = document.querySelector('.hero-panel');
        if (!panel) return;

        let mouse = { x: 0, y: 0, normX: 0, normY: 0 };
        let target = { x: 0, y: 0, normX: 0, normY: 0 };
        let isHovering = false;

        panel.addEventListener('mousemove', (e) => {
            const rect = panel.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.normX = (mouse.x / rect.width) * 2 - 1;
            mouse.normY = (mouse.y / rect.height) * 2 - 1;
            isHovering = true;
        });

        panel.addEventListener('mouseleave', () => {
            isHovering = false;
            mouse.normX = 0;
            mouse.normY = 0;
        });

        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        const particleContainer = document.createElement('div');
        particleContainer.style.position = 'absolute';
        particleContainer.style.inset = '0';
        particleContainer.style.pointerEvents = 'none';
        particleContainer.style.overflow = 'hidden';
        particleContainer.style.zIndex = '10';
        panel.appendChild(particleContainer);

        const particles = [];
        for(let i=0; i<15; i++) {
            const p = document.createElement('div');
            p.style.position = 'absolute';
            p.style.width = '4px';
            p.style.height = '4px';
            p.style.backgroundColor = '#2A9D8F';
            p.style.borderRadius = '50%';
            p.style.opacity = '0';
            p.style.transition = 'opacity 0.3s ease';
            particleContainer.appendChild(p);
            particles.push({
                el: p,
                x: Math.random() * panel.clientWidth,
                y: Math.random() * panel.clientHeight,
                vx: 0, vy: 0,
                baseX: Math.random() * panel.clientWidth,
                baseY: Math.random() * panel.clientHeight
            });
        }

        let scrapeParticle = document.createElement('div');
        scrapeParticle.style.position = 'absolute';
        scrapeParticle.style.width = '12px';
        scrapeParticle.style.height = '16px';
        scrapeParticle.style.backgroundColor = '#E63946';
        scrapeParticle.style.borderRadius = '3px';
        scrapeParticle.style.opacity = '0';
        scrapeParticle.style.transition = 'opacity 0.2s';
        scrapeParticle.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';
        particleContainer.appendChild(scrapeParticle);
        let scraping = false;
        let scrapeProgress = 0;

        function animate() {
            target.normX = lerp(target.normX, mouse.normX, 0.1);
            target.normY = lerp(target.normY, mouse.normY, 0.1);

            const char1 = document.querySelector('#char-1');
            const char2 = document.querySelector('#char-2');
            const magGlass = document.querySelector('#char-1-tool') || document.querySelector('#magnifying-glass');
            const net = document.querySelector('#char-2-tool') || document.querySelector('#net');
            const webGroup = document.querySelector('#webpage-group');

            if (char1) char1.style.transform = `translate(${150 + target.normX * 15}px, ${120 + target.normY * 15}px)`;
            if (char2) {
                let s = 1;
                if(scraping && scrapeProgress > 0.8) s = 1.05;
                char2.style.transform = `translate(${1080 + target.normX * 10}px, ${200 + target.normY * 10}px) scale(${s})`;
            }
            if (magGlass) {
                const angle = Math.atan2(target.normY, target.normX) * (180 / Math.PI);
                magGlass.style.transform = `translate(95px, 90px) rotate(${angle * 0.1}deg)`;
            }
            if (net) {
                const angle = Math.atan2(target.normY, target.normX) * (180 / Math.PI);
                net.style.transform = `translate(-120px, 40px) rotate(${angle * 0.2}deg)`;
            }
            if (webGroup) {
                webGroup.style.transform = `translate(420px, 80px) rotateX(${-target.normY * 5}deg) rotateY(${target.normX * 5}deg)`;
                
                const rect = webGroup.getBoundingClientRect();
                const pRect = panel.getBoundingClientRect();
                const wx = rect.left - pRect.left + rect.width/2;
                const wy = rect.top - pRect.top + rect.height/2;
                const dist = Math.hypot(mouse.x - wx, mouse.y - wy);
                
                if (dist < 150 && isHovering) {
                    webGroup.style.filter = 'drop-shadow(0 0 8px rgba(42, 157, 143, 0.5))';
                    if (!scraping) {
                        scraping = true;
                        scrapeProgress = 0;
                        scrapeParticle.style.opacity = '1';
                    }
                } else {
                    webGroup.style.filter = 'none';
                    if(scraping && scrapeProgress >= 1) {
                        scraping = false;
                        scrapeParticle.style.opacity = '0';
                    } else if (!scraping) {
                        scrapeParticle.style.opacity = '0';
                    }
                }
            }

            if (scraping && char2 && webGroup) {
                scrapeProgress += 0.04;
                if (scrapeProgress > 1) {
                    scraping = false;
                    scrapeParticle.style.opacity = '0';
                } else {
                    const rW = webGroup.getBoundingClientRect();
                    const rC = char2.getBoundingClientRect();
                    const pR = panel.getBoundingClientRect();
                    
                    const startX = rW.left - pR.left + rW.width/2;
                    const startY = rW.top - pR.top + rW.height/2;
                    const endX = rC.left - pR.left + rC.width/2;
                    const endY = rC.top - pR.top + rC.height/2;
                    
                    const px = lerp(startX, endX, scrapeProgress);
                    const py = lerp(startY, endY, scrapeProgress);
                    
                    scrapeParticle.style.transform = `translate(${px}px, ${py}px) rotate(${scrapeProgress * 360}deg)`;
                }
            }

            particles.forEach(p => {
                if (isHovering) {
                    p.el.style.opacity = '0.6';
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 80) {
                        p.vx -= (dx / dist) * 1.5;
                        p.vy -= (dy / dist) * 1.5;
                    } else if (dist < 300) {
                        p.vx += (dx / dist) * 0.08;
                        p.vy += (dy / dist) * 0.08;
                    }
                } else {
                    p.el.style.opacity = '0';
                    const dx = p.baseX - p.x;
                    const dy = p.baseY - p.y;
                    p.vx += dx * 0.02;
                    p.vy += dy * 0.02;
                }
                
                p.vx *= 0.85;
                p.vy *= 0.85;
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
            });

            requestAnimationFrame(animate);
        }
        animate();
    })();
</script>
